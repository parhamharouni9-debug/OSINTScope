[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osintscope"
version = "0.1.0"
description = "Passive domain infrastructure investigations with attributable evidence and local history"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["idna>=3.7,<4"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Name Service (DNS)",
]

[project.scripts]
osintscope = "osintscope.cli:main"

[tool.setuptools.packages.find]
include = ["osintscope*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
